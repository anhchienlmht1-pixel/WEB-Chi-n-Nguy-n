# Tính sẵn tín hiệu, nhật ký lệnh, sóng ngành, quét MA, quỹ mở mỗi ngày giao dịch
# sau 15:00 (giờ VN) và lưu vào nhánh `precomputed-data` của repo này — web chỉ
# đọc kết quả qua raw.githubusercontent.com, không tự quét toàn bộ mã (đỡ tốn CPU).
# Không cần secret: dùng token có sẵn của GitHub Actions. Xem server/src/jobs/precompute.ts.
name: Tính sẵn dữ liệu hằng ngày

on:
  schedule:
    # 15:40 và 17:10 giờ VN, thứ 2–6 (lần 2 phòng khi nguồn dữ liệu chậm)
    - cron: "40 8 * * 1-5"
    - cron: "10 10 * * 1-5"
  workflow_dispatch:
  push:
    # chạy thử trên nhánh xem thử khi sửa job (ghi vào thư mục preview)
    branches: [sonmai]
    paths: ["server/src/jobs/**", "server/src/signals/precomputed.ts", ".github/workflows/precompute.yml"]

concurrency:
  group: precompute
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Tính sẵn
        working-directory: server
        env:
          PRECOMPUTE_OUT_DIR: ${{ runner.temp }}/pre
          VERCEL_ENV: ${{ github.ref == 'refs/heads/sonmai' && 'preview' || 'production' }}
          TZ: Asia/Ho_Chi_Minh
        run: npx tsx src/jobs/precompute.ts
      - name: Lưu vào nhánh precomputed-data
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -e
          cd "$RUNNER_TEMP"
          # giữ thư mục của môi trường kia (prod/preview), chỉ thay phần vừa tính
          if git clone -q --depth 1 --branch precomputed-data "$REPO_URL" old; then rm -rf old/.git; else mkdir old; fi
          mkdir data && cp -r old/. data/ && cp -r pre/. data/
          cd data
          git init -q -b precomputed-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Tính sẵn $(date +%F_%H%M)"
          # một commit duy nhất, ghi đè: nhánh không phình theo thời gian
          git push -q -f "$REPO_URL" precomputed-data
